# Perdorim lokal — testim i Dockerfile-it dhe Postgres PARA se te shkosh
# ne Render/Neon. S'prek .env-in tend ekzistues (sqlite): DATABASE_URL
# poshte e mbishkruan qellimisht per te drejtuar drejt Postgres-it te
# ketij compose-i, jo drejt sqlite-it lokal.
#
# Perdorim:
#   docker compose up --build
#   http://localhost:8000/admin/

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: thesarislam
      POSTGRES_USER: thesarislam
      POSTGRES_PASSWORD: thesarislam_local_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thesarislam"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://thesarislam:thesarislam_local_dev@db:5432/thesarislam
      DEBUG: "True"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media

volumes:
  pgdata:
